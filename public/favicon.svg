
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de Fondo MEP -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="50%" stop-color="#002B49"/>
      <stop offset="100%" stop-color="#0A3C66"/>
    </linearGradient>

    <!-- Gradiente Dorado MEP -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D4AF5A"/>
      <stop offset="100%" stop-color="#B48A30"/>
    </linearGradient>

    <!-- Gradiente Cian Tecnológico -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Gradiente Esmeralda de Éxito -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Sombra suave -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo: Escudo redondeado con borde dorado -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#dropShadow)" />

  <!-- Líneas de Circuito / Diagnóstico Tecnológico sutiles -->
  <g opacity="0.22" stroke="#38BDF8" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 90 160 L 170 160 L 210 200" />
    <circle cx="90" cy="160" r="8" fill="#38BDF8" />
    <path d="M 422 160 L 342 160 L 302 200" />
    <circle cx="422" cy="160" r="8" fill="#38BDF8" />
    <path d="M 90 352 L 170 352 L 210 312" />
    <circle cx="90" cy="352" r="8" fill="#38BDF8" />
    <path d="M 422 352 L 342 352 L 302 312" />
    <circle cx="422" cy="352" r="8" fill="#38BDF8" />
  </g>

  <!-- Escudo Central de Diagnóstico -->
  <path d="M 256 96 
           C 336 96, 380 120, 380 120 
           L 380 248 
           C 380 340, 256 408, 256 408 
           C 256 408, 132 340, 132 248 
           L 132 120 
           C 132 120, 176 96, 256 96 Z"
        fill="#001830"
        stroke="url(#cyanGrad)"
        stroke-width="10"
        filter="url(#dropShadow)" />

  <!-- Gráfico de Diagnóstico / Barras de Telemetría dentro del escudo -->
  <g transform="translate(186, 240)">
    <!-- Barra 1 (Cognitivo) -->
    <rect x="0" y="30" width="24" height="55" rx="8" fill="url(#cyanGrad)" />
    <!-- Barra 2 (Socioafectivo) -->
    <rect x="36" y="0" width="24" height="85" rx="8" fill="url(#goldGrad)" />
    <!-- Barra 3 (Psicomotor) -->
    <rect x="72" y="18" width="24" height="67" rx="8" fill="url(#emeraldGrad)" />
    <!-- Barra 4 (Logro General) -->
    <rect x="108" y="-15" width="24" height="100" rx="8" fill="#38BDF8" />
  </g>

  <!-- Birrete / Insignia Educativa en la parte superior del escudo -->
  <g transform="translate(256, 175) scale(0.9)">
    <!-- Rombo de graduación -->
    <path d="M 0 -38 L 85 0 L 0 38 L -85 0 Z" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="4" />
    <!-- Casquete inferior -->
    <path d="M -48 10 C -48 38, 48 38, 48 10" fill="#001F3F" stroke="url(#goldGrad)" stroke-width="6" />
    <!-- Borla / Tassel -->
    <path d="M 50 5 C 65 15, 75 35, 75 52" fill="none" stroke="#FCD34D" stroke-width="5" stroke-linecap="round" />
    <circle cx="75" cy="54" r="6" fill="#FCD34D" />
  </g>

  <!-- Insignia MEP en la base -->
  <rect x="186" y="380" width="140" height="38" rx="19" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="3" filter="url(#dropShadow)" />
  <text x="256" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="900" fill="#002B49" text-anchor="middle" letter-spacing="3">MEP</text>
</svg>
