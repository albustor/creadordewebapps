<!-- =====================================================
     ENCABEZADO
====================================================== -->

<header class="header">

    <h1>
        DIAGNÓSTICO FT
    </h1>

    <p>
        Registro de resultados — 9.º año
    </p>

</header>


<div class="container">


<!-- =====================================================
     PASO 1
     CONFIGURACIÓN
====================================================== -->

<section
    id="configuracion"
    class="card"
>

    <h2>
        Configurar diagnóstico
    </h2>


    <label for="centro">
        Centro Educativo
    </label>


    <input
        id="centro"
        type="text"
        placeholder="Ingrese el Centro Educativo"
        autocomplete="off"
    >


    <label for="nivel">
        Nivel
    </label>


    <select id="nivel">

        <option value="9.º año">
            9.º año
        </option>

    </select>


    <label for="seccion">
        Sección
    </label>


    <input
        id="seccion"
        type="text"
        placeholder="Ejemplo: 9-4"
        autocomplete="off"
    >


    <button
        id="btnIniciar"
        class="btn-primary"
        onclick="iniciarDiagnostico()"
    >
        INICIAR DIAGNÓSTICO
    </button>

<!-- =====================================================
     PASO 2
     SESIÓN
====================================================== -->

    id="sesion"

        id="sessionInfo"

        id="contador"

    </div>

        id="btnEscanear"
        class="btn-primary"
        onclick="iniciarEscaner()"
    >
        📷 ESCANEAR CÓDIGO QR
    </button>

        id="reader"
        class="hidden"
    ></div>

        id="scannerMessage"
        class="scanner-message"
    ></div>

        <button
            class="btn-secondary"
            onclick="mostrarRegistros()"
        >

        </button>

            onclick="exportarCSV()"
        >
            EXPORTAR CSV
        </button>


        <button
            class="btn-danger"
            onclick="finalizarDiagnostico()"

<!-- =====================================================

<script>

/* ==========================================================
   CONFIGURACIÓN GENERAL
========================================================== */


/*
    Clave utilizada para guardar los registros
    en el almacenamiento local del teléfono.
*/

const STORAGE_KEY =
    "diagnostico_ft_registros_v1";


/*
    Sesión actual.

    El docente solamente indica:
    - Centro Educativo
    - Nivel
    - Sección

    NO se solicita:
    - docente
    - fecha

    La fecha viene en el QR.
*/

let sesion = {

    centro:"",
    nivel:"9.º año",
    seccion:""

};


/*
    Resultado QR pendiente
    antes de guardarlo.
*/

let resultadoPendiente = null;


/*
    Objeto del lector QR.
*/

let qrScanner = null;


/*
    Evita leer varias veces
    el mismo QR.
*/

let procesandoQR = false;


/* ==========================================================
   INICIO
========================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        actualizarContador();

    }
);


/* ==========================================================
   INICIAR DIAGNÓSTICO
========================================================== */

function iniciarDiagnostico(){

    const centro =
        document
            .getElementById("centro")
            .value
            .trim();


    const nivel =
        document
            .getElementById("nivel")
            .value;


    const seccion =
        document
            .getElementById("seccion")
            .value
            .trim();


    /*
        Validación
    */

    if(!centro){

        alert(
            "Debe indicar el Centro Educativo."
        );

        return;

    }


    if(!seccion){

        alert(
            "Debe indicar la sección."
        );

        return;

    }


    /*
        Guardar sesión
    */

    sesion = {

        centro:centro,

        nivel:nivel,

        seccion:seccion

    };


    /*
        Mostrar sesión
    */

    document
        .getElementById("sessionInfo")
        .innerHTML = `

            <strong>
                Centro Educativo:
            </strong>

            ${escaparHTML(sesion.centro)}

            <br>

            <strong>
                Nivel:
            </strong>

            ${escaparHTML(sesion.nivel)}

            <br>

            <strong>
                Sección:
            </strong>

            ${escaparHTML(sesion.seccion)}

        `;


    /*
        Cambiar pantalla
    */

    document
        .getElementById("configuracion")
        .classList
        .add("hidden");


    document
        .getElementById("sesion")
        .classList
        .remove("hidden");


    document
        .getElementById("registros")
        .classList
        .remove("hidden");


    actualizarContador();


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* ==========================================================
   INICIAR ESCÁNER
========================================================== */

async function iniciarEscaner(){

    /*
        Evitar dos lectores simultáneos.
    */

    if(qrScanner){

        return;

    }


    procesandoQR = false;


    document
        .getElementById("reader")
        .classList
        .remove("hidden");


    document
        .getElementById("scannerMessage")
        .innerHTML = `

            <div class="alert alert-info">

                Apunte la cámara del teléfono
                al código QR del estudiante.

            </div>

        `;


    try{

        qrScanner =
            new Html5Qrcode("reader");


        const configuracion = {

            fps:10,

            qrbox:{

                width:250,

                height:250

            },

            aspectRatio:1.0

        };


        await qrScanner.start(

            {
                facingMode:"environment"
            },

            configuracion,

            qrDetectado,

            errorDeLectura

        );


    }

    catch(error){

        console.error(error);


        qrScanner = null;


        document
            .getElementById("reader")
            .classList
            .add("hidden");


        document
            .getElementById("scannerMessage")
            .innerHTML = `

                <div class="alert alert-error">

                    <strong>
                        No fue posible activar la cámara.
                    </strong>

                    <br><br>

                    Compruebe que:

                    <br>
                    • El navegador tenga permiso
                    para utilizar la cámara.

                    <br>
                    • La aplicación esté abierta
                    mediante HTTPS.

                    <br>
                    • Ninguna otra aplicación esté
                    utilizando la cámara.

                </div>

            `;

    }

}


/* ==========================================================
   QR DETECTADO
========================================================== */

async function qrDetectado(texto){

    /*
        Evitar lecturas repetidas.
    */

    if(procesandoQR){

        return;

    }


    procesandoQR = true;


    console.log(
        "QR detectado:",
        texto
    );


    await detenerEscaner();


    try{

        const resultado =
            interpretarQR(texto);


        resultadoPendiente =
            resultado;


        mostrarResultado(
            resultado
        );


    }

    catch(error){

        console.error(error);


        resultadoPendiente = null;


        procesandoQR = false;


        document
            .getElementById("scannerMessage")
            .innerHTML = `

                <div class="alert alert-error">

                    <strong>
                        QR leído, pero no reconocido.
                    </strong>

                    <br><br>

                    ${escaparHTML(
                        error.message
                    )}

                </div>

            `;

    }

}


/* ==========================================================
   ERROR DURANTE ESCANEO
========================================================== */

function errorDeLectura(error){

    /*
        No mostramos estos errores.

        El lector genera muchos mensajes mientras
        busca un código QR.

    */

}


/* ==========================================================
   DETENER ESCÁNER
========================================================== */

async function detenerEscaner(){

    if(!qrScanner){

        return;

    }


    try{

        await qrScanner.stop();

    }

    catch(error){

        console.log(
            "El escáner ya estaba detenido."
        );

    }


    try{

        await qrScanner.clear();

    }

    catch(error){

        console.log(
            "No fue necesario limpiar el lector."
        );

    }


    qrScanner = null;


    document
        .getElementById("reader")
        .classList
        .add("hidden");

}


/* ==========================================================
   INTERPRETAR QR
==========================================================

   IMPORTANTE:

   Esta función NO modifica el QR.

   Solamente interpreta el texto existente.

========================================================== */

function interpretarQR(texto){

    if(
        !texto ||
        !texto.trim()
    ){

        throw new Error(
            "El código QR está vacío."
        );

    }


    /*
        Convertimos el contenido en líneas.
    */

    const lineas =
        texto
            .split(/\r?\n/)
            .map(
                linea =>
                    linea.trim()
            );


    /*
        Eliminamos únicamente líneas
        completamente vacías al inicio
        y al final.

        NO alteramos el contenido.
    */

    while(
        lineas.length &&
        lineas[0] === ""
    ){

        lineas.shift();

    }


    while(
        lineas.length &&
        lineas[lineas.length - 1] === ""
    ){

        lineas.pop();

    }


    /*
        Objeto resultado.
    */

    const datos = {

        estudiante:"",

        seccionQR:"",

        fecha:"",

        cognoscitiva:"",

        nivelCognoscitivo:"",

        tarjetas:"",

        puertos:"",

        ejecucion:"",

        socioafectiva:"",

        fortalezas:"",

        prioridades:"",

        textoOriginal:texto

    };


    /*
        =====================================================
        PRIMERAS TRES LÍNEAS
        =====================================================

        Allan
        9-4
        23/09/2026
    */

    if(lineas.length >= 3){

        datos.estudiante =
            lineas[0];

        datos.seccionQR =
            lineas[1];

        datos.fecha =
            lineas[2];

    }


    /*
        =====================================================
        RESTO DE CAMPOS
        =====================================================
    */

    for(
        let i=0;
        i<lineas.length;
        i++
    ){

        const linea =
            lineas[i];


        /*
            COGNOSCITIVA
        */

        if(
            linea
            .toUpperCase()
            .startsWith(
                "COGNOSCITIVA:"
            )
        ){

            datos.cognoscitiva =
                quitarPrefijo(
                    linea,
                    "COGNOSCITIVA:"
                );

        }


        /*
            NIVEL
        */

        else if(
            linea
            .toUpperCase()
            .startsWith(
                "NIVEL:"
            )
        ){

            datos.nivelCognoscitivo =
                quitarPrefijo(
                    linea,
                    "Nivel:"
                );

        }


        /*
            TARJETAS
        */

        else if(
            linea
            .toUpperCase()
            .startsWith(
                "TARJETAS:"
            )
        ){

            datos.tarjetas =
                quitarPrefijo(
                    linea,
                    "Tarjetas:"
                );

        }


        /*
            PUERTOS
        */

        else if(
            linea
            .toUpperCase()
            .startsWith(
                "PUERTOS:"
            )
        ){

            datos.puertos =
                quitarPrefijo(
                    linea,
                    "Puertos:"
                );

        }


        /*
            EJECUCIÓN
        */

        else if(
            linea
            .toUpperCase()
            .startsWith(
                "EJECUCIÓN:"
            )
        ){

            datos.ejecucion =
                quitarPrefijo(
                    linea,
                    "Ejecución:"
                );

        }


        /*
            SOCIOAFECTIVA
        */

        else if(
            linea
                .toLowerCase()
                .includes(
                    "indicadores favorables"
                )
        ){

            datos.socioafectiva =
                linea;

        }


        /*
            FORTALEZAS
        */

        else if(
            linea
                .toUpperCase()
                ===
                "FORTALEZAS:"
        ){

            datos.fortalezas =
                obtenerContenidoSiguiente(
                    lineas,
                    i
                );

        }


        /*
            PRIORIDADES
        */

        else if(
            linea
                .toUpperCase()
                ===
                "PRIORIDADES:"
        ){

            datos.prioridades =
                obtenerContenidoSiguiente(
                    lineas,
                    i
                );

        }

    }


    /*
        Validación mínima.

        No exigimos que todos los campos existan,
        para evitar rechazar un QR válido si en
        el futuro cambia alguna línea.

    */

    if(
        !datos.estudiante
    ){

        throw new Error(
            "No se encontró el nombre del estudiante."
        );

    }


    return datos;

}


/* ==========================================================
   QUITAR PREFIJO
========================================================== */

function quitarPrefijo(
    texto,
    prefijo
){

    return texto
        .substring(
            prefijo.length
        )
        .trim();

}


/* ==========================================================
   OBTENER SIGUIENTE CONTENIDO
========================================================== */

function obtenerContenidoSiguiente(
    lineas,
    indice
){

    for(
        let i=indice + 1;
        i<lineas.length;
        i++
    ){

        if(
            lineas[i].trim() !== ""
        ){

            return lineas[i].trim();

        }

    }


    return "";

}


/* ==========================================================
   MOSTRAR RESULTADO
========================================================== */

function mostrarResultado(
    datos
){

    const html = `

        <div class="result-grid">


            <div class="result-item">

                <strong>
                    Estudiante
                </strong>

                ${escaparHTML(
                    datos.estudiante
                )}

            </div>


            <div class="result-item">

                <strong>
                    Fecha
                </strong>

                ${escaparHTML(
                    datos.fecha

/* ==========================================================
   GUARDAR REGISTRO
========================================================== */

function guardarRegistro(){

    if(
        !resultadoPendiente
    ){

        alert(
            "No hay ningún resultado pendiente."
        );

        return;

    }


    /*
        Obtener registros actuales.
    */

    const registros =
        obtenerRegistros();


    /*
        Evitar duplicado exacto.
    */

    const duplicado =
        registros.some(
            registro =>

                registro.estudiante
                ===
                resultadoPendiente.estudiante

                &&

                registro.fecha
                ===
                resultadoPendiente.fecha

                &&

                registro.seccion
                ===
                sesion.seccion

        );


    if(duplicado){

        const continuar =
            confirm(

                "Este estudiante ya tiene un registro " +
                "con la misma fecha y sección.\n\n" +

                "¿Desea guardarlo nuevamente?"

            );


        if(!continuar){

            procesandoQR = false;

            return;

        }

    }


    /*
        Crear registro completo.
    */

    const registro = {

        id:
            generarID(),


        centro:
            sesion.centro,


        nivel:
            sesion.nivel,


        seccion:
            sesion.seccion,


        estudiante:
            resultadoPendiente.estudiante,


        fecha:
            resultadoPendiente.fecha,


        cognoscitiva:
            resultadoPendiente.cognoscitiva,


        nivelCognoscitivo:
            resultadoPendiente.nivelCognoscitivo,


        tarjetas:
            resultadoPendiente.tarjetas,


        puertos:
            resultadoPendiente.puertos,


        ejecucion:
            resultadoPendiente.ejecucion,


        socioafectiva:
            resultadoPendiente.socioafectiva,


        fortalezas:
            resultadoPendiente.fortalezas,


        prioridades:
            resultadoPendiente.prioridades,


        /*
            Guardamos también el QR original.

            Esto es útil para auditoría y para
            corregir posteriormente el interpretador
            si fuese necesario.
        */

        qrOriginal:
            resultadoPendiente.textoOriginal,


        fechaRegistroLocal:
            new Date().toISOString()

    };


    /*
        Agregar al arreglo.
    */

    registros.push(
        registro
    );


    /*
        Guardar en localStorage.
    */

    guardarRegistros(
        registros
    );


    /*
        Limpiar resultado pendiente.
    */

    resultadoPendiente =
        null;


    /*
        Ocultar resultado.
    */

    document
        .getElementById(
            "resultado"
        )
        .classList
        .add("hidden");


    /*
        Actualizar contador.
    */

    actualizarContador();


    /*
        Mensaje.
    */

    document
        .getElementById(
            "scannerMessage"
        )
        .innerHTML = `

            <div class="alert alert-success">

                <strong>
                    Registro guardado correctamente.
                </strong>

                <br>

                El estudiante quedó almacenado
                en este dispositivo.

            </div>

        `;


    /*
        Permitir próximo QR.
    */

    procesandoQR =
        false;


    /*
        Volver a la sección activa.
    */

    window.scrollTo({

        top:
            document
                .getElementById(
                    "sesion"
                )
                .offsetTop - 10,

        behavior:"smooth"

    });

}

/* ==========================================================
   OBTENER REGISTROS
========================================================== */

function obtenerRegistros(){

    try{

        const datos =
            localStorage.getItem(
                STORAGE_KEY
            );


        if(!datos){

            return [];

        }


        const registros =
            JSON.parse(datos);


        if(
            !Array.isArray(
                registros
            )
        ){

            return [];

        }


        return registros;

    }

    catch(error){

        console.error(
            "Error leyendo registros:",
            error
        );


        return [];

    }

}


/* ==========================================================
   GUARDAR REGISTROS
========================================================== */

function guardarRegistros(
    registros
){

    try{

        localStorage.setItem(

            STORAGE_KEY,

            JSON.stringify(
                registros
            )

        );


        return true;

    }

    catch(error){

        console.error(
            "No se pudieron guardar los registros:",
            error
        );


        alert(
            "No fue posible guardar el registro " +
            "en el dispositivo."
        );


        return false;

    }

}

/* ==========================================================
   ELIMINAR UN REGISTRO
========================================================== */

function eliminarRegistro(
    id
){

    const confirmar =
        confirm(

            "¿Desea eliminar este registro?"

        );


    if(!confirmar){

        return;

    }


    const registros =
        obtenerRegistros();


    const nuevos =
        registros.filter(
            registro =>
                String(
                    registro.id
                )
                !==
                String(id)
        );


    guardarRegistros(
        nuevos
    );


    actualizarContador();

    mostrarRegistros();

}

/* ==========================================================
   EXPORTAR CSV
========================================================== */

function exportarCSV(){

    const registros =
        obtenerRegistros();


    if(
        registros.length === 0
    ){

        alert(
            "No hay registros para exportar."
        );

        return;

    }


    /*
        Encabezados.
    */

    const encabezados = [

        "Centro Educativo",

        "Nivel",

        "Sección",

        "Estudiante",

        "Fecha",

        "Cognoscitiva",

        "Nivel cognoscitivo",

        "Tarjetas",

        "Puertos",

        "Ejecución",

        "Socioafectiva",

        "Fortalezas",

        "Prioridades"

    ];


    /*
        Crear CSV.
    */

    let csv = "";


    csv += encabezados
        .map(
            campo =>
                '"' +
                csvEscapar(
                    campo
                ) +
                '"'
        )
        .join(";");


    csv += "\n";


    registros.forEach(
        function(
            registro
        ){

            const fila = [

                registro.centro,

                registro.nivel,

                registro.seccion,

                registro.estudiante,

                registro.fecha,

                registro.cognoscitiva,

                registro.nivelCognoscitivo,

                registro.tarjetas,

                registro.puertos,

                registro.ejecucion,

                registro.socioafectiva,

                registro.fortalezas,

                registro.prioridades

            ];


            csv += fila
                .map(
                    campo =>
                        '"' +
                        csvEscapar(
                            campo
                        ) +
                        '"'
                )
                .join(";");


            csv += "\n";

        }
    );


    /*
        BOM para Excel.
    */

    const contenido =
        "\uFEFF" +
        csv;


    const blob =
        new Blob(

            [contenido],

            {
                type:
                    "text/csv;charset=utf-8;"
            }

        );


    const url =
        URL.createObjectURL(
            blob
        );


    const enlace =
        document.createElement(
            "a"
        );


    enlace.href =
        url;


    enlace.download =
        "diagnostico_FT_9no.csv";


    document
        .body
        .appendChild(
            enlace
        );


    enlace.click();


    document
        .body
        .removeChild(
            enlace
        );


    URL.revokeObjectURL(
        url
    );


    /*
        Confirmación.
    */

    alert(
        "Archivo CSV generado correctamente."
    );

}


/* ==========================================================
   ESCAPAR CSV
========================================================== */

function csvEscapar(
    valor
){

    if(
        valor === null ||
        valor === undefined
    ){

        return "";

    }


    return String(
        valor
    )
    .replace(
        /"/g,
        '""'
    )
    .replace(
        /\r?\n/g,
        " "
    );

}


/* ==========================================================
   ESCAPAR HTML
========================================================== */

function escaparHTML(
    valor
){

    if(
        valor === null ||
        valor === undefined
    ){

        return "";

    }


    return String(
        valor
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* ==========================================================

========================================================== */

function generarID(){

    return (

        Date.now()
        .toString(36)

        +

        Math.random()
            .toString(36)
            .substring(2,8)

    );

}
